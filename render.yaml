# Render Blueprint - $0 demo deployment.
#
# Optional: you can create the web service in the dashboard instead. If you use
# this file, Render prompts for every `sync: false` value on first deploy.
#
# Still manual (see Docs/DEPLOYMENT.md "Track B"):
#   - TiDB Cloud Starter database (external MySQL-compatible, free)
#   - Render Key Value (free 25 MB) for REDIS_URL
#   - Supabase Storage bucket (S3-compatible, free 1 GB, no card required)
#
# Free plan notes: the service sleeps after 15 minutes idle and wakes in ~1
# minute; 512 MB RAM; no persistent disk, shell, or one-off jobs.

services:
  - type: web
    name: vendorpulse
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true

      # TiDB Cloud Starter (or any MySQL 8-compatible host)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: vendorpulse
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: VERIFY_IDENTITY
      # Public Let's Encrypt root that TiDB Cloud certificates chain to; it is
      # committed in the repo and copied into the image.
      - key: DB_SSL_CA
        value: /app/Backend/certs/isrgrootx1.pem

      # Render Key Value (Redis-compatible, created by this Blueprint)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: vendorpulse-redis
          property: connectionString

      # Supabase Storage (S3-compatible, free 1 GB)
      - key: SUPABASE_BUCKET
        value: vendorpulse-media
      - key: SUPABASE_ENDPOINT_URL
        value: https://vkukxzxdknzgosqffvji.supabase.co/storage/v1/s3
      - key: SUPABASE_REGION
        value: us-east-1
      # Public URL prefix; the bucket must be public.
      - key: SUPABASE_PUBLIC_HOST
        value: vkukxzxdknzgosqffvji.supabase.co/storage/v1/object/public/vendorpulse-media
      - key: SUPABASE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_SECRET_ACCESS_KEY
        sync: false

      # 512 MB instance: two workers is the practical ceiling.
      - key: WEB_WORKERS
        value: "2"
      - key: WEB_THREADS
        value: "4"

  # Shared cache for DRF throttle counters, so the two Gunicorn workers agree.
  # Empty ipAllowList = private network only; the web service is the only client.
  - type: keyvalue
    name: vendorpulse-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"
