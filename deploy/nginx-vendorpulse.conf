# VendorPulse Nginx site.
# Install: copy to /etc/nginx/sites-available/vendorpulse, replace the domain,
# symlink into sites-enabled, then run certbot --nginx -d <domain>.
#
# Do NOT proxy /admin/ here: the React admin portal owns it. Django's own
# admin is mounted at /django-admin/ (see vendorpulse_core/urls.py).

upstream vendorpulse_app {
    server unix:/run/vendorpulse/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name vendorpulse.example.com;

    client_max_body_size 10m;          # listing photo uploads

    root /var/www/vendorpulse/current/public;
    index index.html;

    # API (URI preserved; Django serves /api/... natively)
    location /api/ {
        proxy_pass http://vendorpulse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django admin (moved off /admin/ so the SPA can own it)
    location /django-admin/ {
        proxy_pass http://vendorpulse_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uptime probe
    location = /health/ {
        proxy_pass http://vendorpulse_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # collectstatic output
    location /static/ {
        alias /var/www/vendorpulse/current/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User uploads (shared across releases)
    location /media/ {
        alias /var/www/vendorpulse/shared/media/;
        expires 7d;
        access_log off;
    }

    # SPA deep links: /products/..., /orders/..., /admin/..., /agent/...
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
